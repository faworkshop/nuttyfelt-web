<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品 · nuttyfelt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+HK:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="works">
    <div class="site-shell">
      <header data-header class="relative z-30"></header>
      <main class="flex-1">
        <section class="section-pad !pb-8">
          <div class="measure-wide">
            <p class="eyebrow">Works</p>
            <h1 class="page-title mt-3" data-copy="works.title">作品</h1>
            <p class="lede" data-copy="works.lede">每件都是按照片手工製作的訂製肖像，不是現貨。</p>
          </div>
        </section>
        <section class="px-5 pb-20 md:px-10 lg:px-16">
          <div class="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
            <figure>
              <div class="photo-frame photo-placeholder aspect-[4/5]"><div class="halo-ring"></div></div>
              <figcaption class="mt-4">
                <p class="font-display text-xl" data-copy="home.workA">栗子</p>
                <p class="mt-1 font-ui text-sm text-ink-muted">Chestnut</p>
              </figcaption>
            </figure>
            <figure>
              <div class="photo-frame photo-placeholder aspect-[4/5]"><div class="halo-ring"></div></div>
              <figcaption class="mt-4">
                <p class="font-display text-xl" data-copy="home.workB">壹壹</p>
                <p class="mt-1 font-ui text-sm text-ink-muted">Yat Yat</p>
              </figcaption>
            </figure>
            <figure class="md:col-span-2">
              <div class="photo-frame photo-placeholder aspect-[16/10] md:aspect-[21/9]"><div class="halo-ring !inset-[8%_30%]"></div></div>
              <figcaption class="mt-4">
                <p class="font-display text-xl" data-copy="home.workC">作品示例</p>
              </figcaption>
            </figure>
          </div>
          <div class="measure mt-16 text-center">
            <a class="btn-primary" href="/commission.html" data-copy="home.ctaPrimary">開始訂製</a>
          </div>
        </section>
      </main>
      <footer data-footer></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
