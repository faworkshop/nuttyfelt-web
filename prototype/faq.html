<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>常見問題 · nuttyfelt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+HK:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="faq">
    <div class="site-shell">
      <header data-header class="relative z-30"></header>
      <main class="flex-1">
        <section class="section-pad !pb-8">
          <div class="measure">
            <p class="eyebrow">FAQ</p>
            <h1 class="page-title mt-3" data-copy="faq.title">常見問題</h1>
            <p class="lede" data-copy="faq.lede">價格、尺寸、時間與不能提供的項目，簡短回答。</p>
          </div>
        </section>
        <section class="px-5 pb-20 md:px-10 lg:px-16">
          <div class="measure divide-y divide-line">
            <details class="group py-5" open>
              <summary class="cursor-pointer font-display text-lg text-ink marker:content-none">價錢多少？</summary>
              <p class="mt-3 leading-relaxed text-ink-muted">常規 HK$5,000。長短毛同價；複雜花色不加價。海外運費與匯款手續費另計。</p>
            </details>
            <details class="group py-5">
              <summary class="cursor-pointer font-display text-lg text-ink">光環多大？</summary>
              <p class="mt-3 leading-relaxed text-ink-muted">短毛約 13 cm；長毛約 15 cm。附畫架與護理蠟。</p>
            </details>
            <details class="group py-5">
              <summary class="cursor-pointer font-display text-lg text-ink">要等多久？</summary>
              <p class="mt-3 leading-relaxed text-ink-muted">暫時約每月一件；製作約 3–4 星期。目標三日內回覆照片與檔期。</p>
            </details>
            <details class="group py-5">
              <summary class="cursor-pointer font-display text-lg text-ink">有什麼不做？</summary>
              <p class="mt-3 leading-relaxed text-ink-muted">張口或特殊表情、頸圈／配件、加急單。</p>
            </details>
            <details class="group py-5">
              <summary class="cursor-pointer font-display text-lg text-ink">點樣交收？</summary>
              <p class="mt-3 leading-relaxed text-ink-muted">香港：順豐到付，或南港島線站面交。海外：實報運費，關稅自付。</p>
            </details>
            <details class="group py-5">
              <summary class="cursor-pointer font-display text-lg text-ink">可以改幾多？</summary>
              <p class="mt-3 leading-relaxed text-ink-muted">尾款後最多兩次小修改。結構比例、換貓、轉頭或改光環尺寸不屬於小修改。</p>
            </details>
          </div>
          <div class="measure mt-12">
            <a class="btn-primary" href="/commission.html" data-copy="home.ctaPrimary">開始訂製</a>
            <a class="ml-4 font-ui text-sm text-brass-deep underline-offset-4 hover:underline" href="/process.html" data-copy="home.howLink">閱讀落單需知</a>
          </div>
        </section>
      </main>
      <footer data-footer></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
